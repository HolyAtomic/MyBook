<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <script type="module" src="src/main.js" defer></script>
    <title>MyBooks</title>
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="./assets/images/book.png" alt="book" class="w-12">
            <h1 class="font-bold text-2xl">MyBooks</h1>
        </div>
        <p class="font-semibold">Ma collection de livres</p>
    </header>
<main class="w-full p-4">
    <div class="mb-4">
        <input 
        type="text"
        id="searching"
        placeholder="Rechercher un livre...."
        class="w-full p-2 mb-2 border rounded-xl"
        >
        <select name="sorting" id="sort" class="w-full p-2 mb-2 border rounded-xl">
            <option value="title">Trier par titre</option>
            <option value="author">Trier par auteur</option>
            <option value="year">Trier par année</option>
        </select>
        <button id="open" type="button" class="w-full p-2 rounded bg-blue-900 text-white">+ Ajouter un livre</button>
    </div>
    <section id="booklist" class="bg-white p-4 rounded-2xl">
        <h2 class="text-xl mb-2 p-2"> Ma Collection</h2>
        <p id="empty" class="text-gray-500">Aucun livre dans votre collection</p>
    <div id="bookcard" class="hidden bg-white p-4 rounded border">

        <h3 id="book-title" class="text-xl font-bold mb-2"></h3>

        <p id="book-author" class="mb-1"></p>

        <p id="book-year" class="mb-1"></p>

        <p id="book-genre" class="mb-1"></p>

        <p id="book-description" class="mb-2"></p>

        <p id="book-status"></p>

  </div>
    </section> 

</main>
</body>
</html>
